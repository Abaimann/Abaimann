<svg width="420" height="285" viewBox="0 0 420 285" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .header { font: 600 18px 'Segoe UI', Ubuntu, Sans-Serif; fill: #fe428e; }
    .item-name { font: 500 13px 'Segoe UI', Ubuntu, Sans-Serif; fill: #f8fafc; }
    .item-cat { font: 400 12px 'Segoe UI', Ubuntu, Sans-Serif; fill: #94a3b8; }
    .bar-bg { fill: #1e293b; rx: 4px; }
    .bar-fill { rx: 4px; }
  </style>
  <rect x="0.5" y="0.5" width="419" height="284" rx="4.5" fill="#0a0a0a" stroke="#18181b"/>
  <text x="25" y="38" class="header">Frameworks &amp; Stacks</text>
  
  <!-- Flutter -->
  <g transform="translate(25, 52)">
    <circle cx="5" cy="8" r="5" fill="#02569B"/>
    <text x="18" y="12" class="item-name">Flutter</text>
    <text x="370" y="12" text-anchor="end" class="item-cat">Mobile (Dart)</text>
    <rect x="0" y="18" width="370" height="6" class="bar-bg"/>
    <rect x="0" y="18" width="340" height="6" fill="#02569B" class="bar-fill"/>
  </g>

  <!-- Laravel -->
  <g transform="translate(25, 96)">
    <circle cx="5" cy="8" r="5" fill="#FF2D20"/>
    <text x="18" y="12" class="item-name">Laravel</text>
    <text x="370" y="12" text-anchor="end" class="item-cat">Fullstack &amp; API (PHP)</text>
    <rect x="0" y="18" width="370" height="6" class="bar-bg"/>
    <rect x="0" y="18" width="315" height="6" fill="#FF2D20" class="bar-fill"/>
  </g>

  <!-- Tailwind CSS -->
  <g transform="translate(25, 140)">
    <circle cx="5" cy="8" r="5" fill="#06B6D4"/>
    <text x="18" y="12" class="item-name">Tailwind CSS</text>
    <text x="370" y="12" text-anchor="end" class="item-cat">Modern UI Styling</text>
    <rect x="0" y="18" width="370" height="6" class="bar-bg"/>
    <rect x="0" y="18" width="280" height="6" fill="#06B6D4" class="bar-fill"/>
  </g>

  <!-- Bootstrap -->
  <g transform="translate(25, 184)">
    <circle cx="5" cy="8" r="5" fill="#7952B3"/>
    <text x="18" y="12" class="item-name">Bootstrap</text>
    <text x="370" y="12" text-anchor="end" class="item-cat">Responsive Components</text>
    <rect x="0" y="18" width="370" height="6" class="bar-bg"/>
    <rect x="0" y="18" width="240" height="6" fill="#7952B3" class="bar-fill"/>
  </g>

  <!-- Node.js & Vite -->
  <g transform="translate(25, 228)">
    <circle cx="5" cy="8" r="5" fill="#22C55E"/>
    <text x="18" y="12" class="item-name">Node.js &amp; Vite</text>
    <text x="370" y="12" text-anchor="end" class="item-cat">Runtime &amp; Build Tool</text>
    <rect x="0" y="18" width="370" height="6" class="bar-bg"/>
    <rect x="0" y="18" width="210" height="6" fill="#22C55E" class="bar-fill"/>
  </g>
</svg>
